name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v0.1.1)'
        required: true
        type: string
concurrency:
  group: prepare-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reliability:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 13306
      DB_USER: scalequeue
      DB_PASSWORD: scalequeue-local
      DB_NAME: scalequeue
      REDIS_URL: redis://127.0.0.1:16379
      REDIS_TEST_URL: redis://127.0.0.1:16379
      MYSQL_TEST_DSN: 'scalequeue:scalequeue-local@tcp(127.0.0.1:13306)/scalequeue?parseTime=true'
      MYSQL_URL: 'scalequeue:scalequeue-local@tcp(127.0.0.1:13306)/scalequeue?parseTime=true'
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use vMAJOR.MINOR.PATCH'; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api-service/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker-service/go.mod
          cache-dependency-path: worker-service/go.sum
      - run: docker compose -f compose.yaml -f compose.test.yaml up -d --wait mysql redis
      - run: npm ci && npm run format:check && npm run lint && npm run build && npm test
        working-directory: api-service
      - run: node scripts/migration-test.cjs
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test -race -count=1 ./... && go build -o /tmp/scalequeue-worker ./cmd/worker
        working-directory: worker-service
      - run: node scripts/integration.cjs
      - run: docker compose build
      - name: Verify complete Compose startup
        run: |
          docker compose -f compose.yaml -f compose.test.yaml down -v
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health && curl -fsS http://127.0.0.1:9090/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Repeated synthetic load test
        run: node scripts/benchmark-report.cjs | tee benchmark-summary.txt
      - name: Build release binaries
        run: bash scripts/build-worker.sh ci-check
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-and-worker-assets
          path: |
            benchmark-results.json
            benchmark-summary.txt
            dist/worker/*
      - if: always()
        run: docker compose logs && docker compose -f compose.yaml -f compose.test.yaml down -v

  draft:
    needs: reliability
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject existing tags or releases
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"; then
            echo "Tag already exists; refusing to change it."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$VERSION" /tmp/release-tags; then
            echo "Release already exists."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker-service/go.mod
          cache-dependency-path: worker-service/go.sum
      - name: Build versioned worker archives
        run: bash scripts/build-worker.sh "$VERSION"
      - name: Tag the tested main commit
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
      - name: Create draft with generated notes
        run: |
          gh release create "$VERSION" dist/worker/* --verify-tag --draft --generate-notes --title "ScaleQueue $VERSION"
          echo "Draft ready in https://github.com/$GH_REPO/releases" >> "$GITHUB_STEP_SUMMARY"
